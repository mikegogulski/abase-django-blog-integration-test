[project]
name = "abase"
version = "0.1.0"  # CalVer: ./.abase/scripts/version.sh
description = "Agentic workflow framework with Beads, Agent Mail, and rules"
readme = "../README-ABASE.md"
requires-python = ">=3.11"

[project.optional-dependencies]
scenario = ["langwatch-scenario>=0.7", "pytest>=8.0", "pytest-asyncio>=0.24", "litellm>=1.40.0"]
mcp-eval = ["mcpevals[pytest]>=0.1", "pytest>=8.0", "pytest-asyncio>=0.24"]
