# mcp-eval config for Agent Mail MCP tests (Classes D, M)
# Requires Agent Mail running: ./.abase/scripts/ensure_agent_mail.sh
# API key: ANTHROPIC_API_KEY or OPENAI_API_KEY
# Import uses .cursor/mcp.json (mcp_agent_mail_http server)

provider: anthropic
model: claude-3-5-sonnet-20241022

mcp:
  import:
    - type: mcp_json
      path: .cursor/mcp.json

default_agent:
  name: agent_mail_tester
  instruction: |
    You are testing the Agent Mail MCP server.
    Use register_agent, file_reservation_paths, send_message, fetch_inbox, acknowledge_message as needed.
  server_names: [mcp_agent_mail_http]
